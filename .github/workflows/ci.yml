name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore backend/Kinevor.Platform.slnx
      - name: Build
        run: dotnet build backend/Kinevor.Platform.slnx -c Release --no-restore
      - name: Test
        run: dotnet test backend/Kinevor.Platform.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack backend/Kinevor.Platform.slnx -c Release --no-build -o backend/artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            backend/artifacts/packages/*.nupkg
            backend/artifacts/packages/*.snupkg

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: web/dist/kinevor-platform-web
