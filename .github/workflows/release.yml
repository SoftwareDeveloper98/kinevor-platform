name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  nuget:
    name: Publish NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore backend/Kinevor.Platform.slnx
      - name: Test
        run: dotnet test backend/Kinevor.Platform.slnx -c Release --no-restore
      - name: Pack
        run: dotnet pack backend/Kinevor.Platform.slnx -c Release --no-build -o backend/artifacts/packages
      - name: Push packages
        run: >
          dotnet nuget push "backend/artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/SoftwareDeveloper98/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
      - name: Push symbols
        run: >
          dotnet nuget push "backend/artifacts/packages/*.snupkg"
          --source "https://nuget.pkg.github.com/SoftwareDeveloper98/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  npm:
    name: Publish npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
          registry-url: https://npm.pkg.github.com
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish ./dist/kinevor-platform-web --registry=https://npm.pkg.github.com --access restricted
